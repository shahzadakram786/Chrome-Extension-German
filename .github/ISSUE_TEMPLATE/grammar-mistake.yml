name: Grammar mistake
description: A conjugation, gender, case or comparison the extension got wrong
title: "Grammar: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks — these are the most valuable reports we get.

        Every form in the grammar panel is generated from rules and a stem
        table, so a wrong answer looks exactly like a right one. We find out
        when someone tells us.

        Please do not paste the page you were reading, or anything private from
        it. The word and the forms are all we need.

  - type: input
    id: word
    attributes:
      label: The word
      description: As you hovered or selected it.
      placeholder: kannst
    validations:
      required: true

  - type: textarea
    id: shown
    attributes:
      label: What the extension showed
      description: If you used the "Report a mistake" button this is filled in already.
      placeholder: |
        Infinitive: können
        Classified as: strong
        Principal parts: können · konnte · gekonnt
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What it should have shown
      description: The correct form, and a source if you have one handy.
      placeholder: |
        können is a modal (Präteritopräsens), not a strong verb.
        https://de.wiktionary.org/wiki/können
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "3.0.0"
    validations:
      required: false
